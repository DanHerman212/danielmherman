# Dedicated build service account (ECC-58): builds must not run as the project
# default SA, which holds broad roles. Create cicd-deployer once (see
# GCP_DEPLOYMENT_GUIDE §18c) and grant it:
#   roles/run.admin                    (deploy + update-traffic + jobs)
#   roles/iam.serviceAccountUser       on website-sa (impersonate the runtime SA)
#   roles/artifactregistry.writer      (push the built image)
#   roles/logging.logWriter            (required for user-specified SAs)
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/cicd-deployer@$PROJECT_ID.iam.gserviceaccount.com'

steps:
  # Gate (F-12.1), unchanged in strictness, halved in cost. Both suites still run
  # before anything is pushed or deployed: `docker push` waits on both of them, and
  # every deploy step waits on the push. A failing test still aborts the build with
  # nothing in Artifact Registry and no revision created.
  #
  # What changed is where the Python suite runs. It used to run in a throwaway
  # `python:3.12-slim` container that installed the requirements again — 206 s of
  # the build, a second full install of dependencies the image installs anyway.
  # It now runs inside the image that is about to be pushed, so the tested
  # interpreter and packages are exactly the deployed ones (F-12.1's intent, more
  # literally than before) and the duplicate install is gone. `collectstatic` no
  # longer needs a step either: the Dockerfile already runs it, so the manifest the
  # page assertions resolve through is present in the image.
  #
  # The seed pull is best effort: a cold repository has no `:latest` to pull and
  # `|| true` keeps the first build after a wipe from failing on that.

  - id: 'pull-cache'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:latest || true'

  # `npm ci`, not `install`: the JS suite imports eslint and jsdom, and the
  # lockfile is the only thing that says which versions the assertions were
  # written against. .dockerignore excludes node_modules, so installing here
  # cannot leak into the image built below. It runs alongside the image build
  # because the two share no inputs.
  - id: 'js-tests'
    name: 'node:22-slim'
    entrypoint: 'sh'
    args: ['-c', 'npm ci --no-audit --no-fund && npm test']
    waitFor: ['-']

  - id: 'build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:latest'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:latest'
      - '.'
    waitFor: ['pull-cache']

  # The Django suite, in development mode on SQLite: the tests must not be able to
  # reach the production database, and they do not need Cloud SQL to prove what
  # they prove. Every setting that differs in production is covered by
  # `check --deploy`, which the migrate job runs against the real environment.
  - id: 'django-tests'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker run --rm -e ENVIRONMENT=development \
          --entrypoint python \
          us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA \
          manage.py test --verbosity 1
    waitFor: ['build']

  # Push the image to Artifact Registry, behind both gates.
  - id: 'push'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman'
    waitFor: ['django-tests', 'js-tests']

  # Deploy the new revision with --no-traffic FIRST (ECC-56): the revision is
  # created but receives no traffic, so the OLD revision keeps serving
  # untouched while migrations and the cohort seed mutate the database below.
  # If any later step fails, the build stops here and production is still the
  # old revision on the old schema — rollback is simply "don't promote".
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'danielmherman'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      # min-instances 0: scale to zero (reference architecture §5 — minimise
      # billable resources). Stated explicitly rather than left unset so a
      # deploy corrects the setting if it is ever flipped by hand. A warm
      # instance removes the cold-start delay, but that is a deliberate, costed
      # exception for a live window only: the site ran min-instances 1 from
      # 2026-09-19 and returns to 0 with this change.
      - '--min-instances'
      - '0'
      - '--no-traffic'
      - '--service-account'
      - 'website-sa@$PROJECT_ID.iam.gserviceaccount.com'
      # Full runtime env, declared in the repo (ECC-46/S1-01): recreating the
      # service from this file yields a correctly configured production site,
      # never a fail-open debug one. ^@^ makes @ the list separator so the
      # comma-holding values survive (see GCP_DEPLOYMENT_GUIDE §15).
      # DEMO_FIXTURE_MODE is intentionally absent: dev scaffolding, forbidden
      # in production by settings.py (S1-02).
      - '--set-env-vars'
      - '^@^ENVIRONMENT=production@GOOGLE_CLOUD_PROJECT=$PROJECT_ID@CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:us-east1:danielmherman-db@GS_BUCKET_NAME=danielmherman-media@ALLOWED_HOSTS=danielmherman.com,www.danielmherman.com,.run.app@CSRF_TRUSTED_ORIGINS=https://danielmherman.com,https://www.danielmherman.com@DEMO_AGENT_URL=https://agent-jamycsjjzq-ue.a.run.app@LANGFUSE_UI_URL=https://observability.danielmherman.com'

  # Run migrations — before the new revision serves traffic.
  # Deploying first would briefly run new code against the old schema.
  # Env is declared here (ECC-46): settings.py fails closed without ENVIRONMENT,
  # so a job recreated from this file can never silently run against SQLite.
  # --args is stated explicitly (not left to the job's persisted state) and
  # also runs createcachetable: the DatabaseCache table django-axes needs for
  # cross-instance lockout state (S1-05). Idempotent on every build.
  # check --deploy is the S1-18 gate: with prod hardening now in place
  # (HSTS, secure cookies, fail-closed env) it should pass clean and fail the
  # build loudly if a security setting regresses.
  # --command sh is REQUIRED: the entrypoint must be the shell. gcloud jobs
  # update only overwrites the flags you pass, so an omitted --command left the
  # stale `python` entrypoint a previous cloudbuild version persisted — the job
  # then ran `python sh -c ...` and died on "can't open file '/app/sh'".
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'migrate'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--service-account'
      - 'website-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - '^@^ENVIRONMENT=production@GOOGLE_CLOUD_PROJECT=$PROJECT_ID@CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:us-east1:danielmherman-db@GS_BUCKET_NAME=danielmherman-media@ALLOWED_HOSTS=danielmherman.com,www.danielmherman.com,.run.app@CSRF_TRUSTED_ORIGINS=https://danielmherman.com,https://www.danielmherman.com@DEMO_AGENT_URL=https://agent-jamycsjjzq-ue.a.run.app'
      - '--command'
      - 'sh'
      - '--args'
      - '-c,python manage.py check --deploy --fail-level WARNING && python manage.py migrate && python manage.py createcachetable'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'migrate'
      - '--region'
      - 'us-east1'
      - '--wait'

  # Seed the demo cohort. Runs after migrate (the table must exist) and before
  # deploy (the page should never go live listing zero patients). The command
  # is idempotent — it update_or_creates on hadm_id — so re-running it on every
  # build is harmless and keeps Cloud SQL in step with demo/data/demo_cohort.json.
  #
  # --prune is REQUIRED: without it a cohort shrink (e.g. the synthetic swap,
  # 32 real -> 24 synthetic) would leave the retired patients in the table and
  # the live site would list a stale mix. Seed artifacts are the single source
  # of truth for the cohort; anything absent is intentionally retired.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'seed-demo-patients'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--service-account'
      - 'website-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - '^@^ENVIRONMENT=production@GOOGLE_CLOUD_PROJECT=$PROJECT_ID@CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:us-east1:danielmherman-db@GS_BUCKET_NAME=danielmherman-media@ALLOWED_HOSTS=danielmherman.com,www.danielmherman.com,.run.app@CSRF_TRUSTED_ORIGINS=https://danielmherman.com,https://www.danielmherman.com@DEMO_AGENT_URL=https://agent-jamycsjjzq-ue.a.run.app'
      - '--command'
      - 'python'
      - '--args'
      - 'manage.py,seed_demo_patients,--prune'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'seed-demo-patients'
      - '--region'
      - 'us-east1'
      - '--wait'

  # The retention sweep, as a job: it is DEFINED here and not executed. Its
  # schedule owns the execution (Cloud Scheduler calls jobs:run daily), and this
  # step only guarantees the job exists and carries the current image and the
  # fail-closed environment. Running it on every build would be harmless — it
  # deletes only rows past their expiry — but it would put the sweep's effect in
  # a deploy log where nobody looks for it, and the point of the schedule is that
  # a retention promise is kept by something other than a person remembering.
  #
  # The command is the whole of the retention policy's enforcement: rows past
  # DEMO_CONVERSATION_TTL_HOURS, with their turns. The window and the turn ceiling
  # are read from settings, so the promise and its enforcement cannot drift.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'purge-conversations'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      # A job does not inherit the service's Cloud SQL attachment: without this
      # the socket path does not exist and the sweep dies on
      # `connection to server on socket "/cloudsql/.../.s.PGSQL.5432" failed`,
      # which is how the first execution of this job failed (2026-09-18).
      - '--set-cloudsql-instances'
      - '$PROJECT_ID:us-east1:danielmherman-db'
      - '--service-account'
      - 'website-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - '^@^ENVIRONMENT=production@GOOGLE_CLOUD_PROJECT=$PROJECT_ID@CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:us-east1:danielmherman-db@GS_BUCKET_NAME=danielmherman-media@ALLOWED_HOSTS=danielmherman.com,www.danielmherman.com,.run.app@CSRF_TRUSTED_ORIGINS=https://danielmherman.com,https://www.danielmherman.com@DEMO_AGENT_URL=https://agent-jamycsjjzq-ue.a.run.app'
      - '--command'
      - 'python'
      - '--args'
      - 'manage.py,purge_expired_conversations'

  # Promote the new revision ONLY after migrations and the cohort seed have
  # succeeded. Until this step runs, production still serves the old revision
  # (the --no-traffic revision above was created but never routed to).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'danielmherman'
      - '--to-latest'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'

  # Post-shift smoke check (F-12.2). The ordering above is right — the revision
  # is created without traffic, migrations and the cohort seed run against the
  # old revision still serving, and only then does traffic move. What was absent
  # is anything that looks at the site AFTER the move: a revision that boots but
  # fails on its first real request had already taken production by the time
  # anyone noticed.
  #
  # It retries because the shift is not instantaneous at the edge, and it fails
  # the build after five attempts, which is the only outcome that is useful —
  # a check that logs and continues is the same as no check. The root path is
  # the cheapest true request: it renders the landing page through the view
  # layer and the database, so a broken revision, a failed migration or an
  # unreachable database all show up as a non-2xx/3xx.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        CODE=000
        for attempt in 1 2 3 4 5 6 7 8; do
          CODE=$$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            https://danielmherman.com/ || true)
          echo "smoke attempt $$attempt: HTTP $${CODE}"
          case "$${CODE}" in
            2*|3*) exit 0 ;;
          esac
          sleep 5
        done
        echo "site not serving after the traffic shift (last status $${CODE})" >&2
        exit 1

images:
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  # The default worker is 1 vCPU. `docker build` and the Django suite are the two
  # CPU-bound steps and they are the reason npm was ever serialised behind them;
  # eight cores is what makes the parallel layout above worth having.
  machineType: 'E2_HIGHCPU_8'