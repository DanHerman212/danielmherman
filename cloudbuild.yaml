steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:latest'
      - '.'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman'

  # Run migrations FIRST — before the new revision serves traffic.
  # Deploying first would briefly run new code against the old schema.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'migrate'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--service-account'
      - 'website-sa@$PROJECT_ID.iam.gserviceaccount.com'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'migrate'
      - '--region'
      - 'us-east1'
      - '--wait'

  # Seed the demo cohort. Runs after migrate (the table must exist) and before
  # deploy (the page should never go live listing zero patients). The command
  # is idempotent — it update_or_creates on hadm_id — so re-running it on every
  # build is harmless and keeps Cloud SQL in step with demo/data/demo_cohort.json.
  #
  # --prune is REQUIRED: without it a cohort shrink (e.g. the synthetic swap,
  # 32 real -> 24 synthetic) would leave the retired patients in the table and
  # the live site would list a stale mix. Seed artifacts are the single source
  # of truth for the cohort; anything absent is intentionally retired.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'seed-demo-patients'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--service-account'
      - 'website-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--args'
      - 'manage.py,seed_demo_patients,--prune'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'seed-demo-patients'
      - '--region'
      - 'us-east1'
      - '--wait'

  # Deploy to Cloud Run only after migrations succeed.
  # If the migrate step fails, the build stops here and the old revision keeps serving.
  #
  # --service-account is stated explicitly even though `run deploy --image` would
  # preserve whatever the service already had. Leaving it implicit means the identity
  # lives only in console state: anyone who recreates the service from this file gets
  # the default compute account, which can read every bucket in the project. Naming it
  # here makes the least-privilege choice part of the repo rather than a setting
  # someone has to remember.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'danielmherman'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--service-account'
      - 'website-sa@$PROJECT_ID.iam.gserviceaccount.com'

images:
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:$COMMIT_SHA'
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/danielmherman-repo/danielmherman:latest'

options:
  logging: CLOUD_LOGGING_ONLY